<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRM Fibra Óptica</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                M
            </div>

            <h1>CRM Fibra Óptica</h1>

            <p>Panel de gestión de clientes</p>

            <form id="loginForm">

                <label>Usuario</label>

                <input
                    type="text"
                    id="usuario"
                    placeholder="Ingresá tu usuario"
                    required
                >

                <label>Contraseña</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingresá tu contraseña"
                    required
                >

                <button type="submit">
                    INGRESAR
                </button>

            </form>

            <p id="mensaje"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
