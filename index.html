<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VANTIX CRM</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                V
            </div>

            <h1>VANTIX</h1>

            <p>CRM de gestión de clientes</p>

            <form id="loginForm">

                <label for="usuario">
                    📧 Correo electrónico
                </label>

                <input
                    type="email"
                    id="usuario"
                    placeholder="Ingresá tu correo"
                    autocomplete="email"
                    required
                >

                <label for="password">
                    🔐 Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingresá tu contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    🚀 INGRESAR
                </button>

            </form>

            <p id="mensaje"></p>

        </div>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- VANTIX -->
    <script src="script.js"></script>

</body>

</html>
